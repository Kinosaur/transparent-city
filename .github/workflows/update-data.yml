name: Update Traffy Data

# Publishing is temporarily manual-only while the historical data archive is
# recovered. Re-enable the Monday schedule only after durable raw storage is
# configured and a full recovery run has passed the coverage contract.
on:
  workflow_dispatch:
    inputs:
      months:
        description: 'Number of recent months to re-download (default: 2)'
        required: false
        default: '2'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated JSON files

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      # ── Cache strategy ──────────────────────────────────────────────────────
      # CSVs are NOT committed to git (too large for a repo). GitHub Actions
      # cache is an optimisation only; it is not durable storage. The coverage
      # contract below prevents a cache miss from becoming a partial publish.
      #
      # Cache key: year + ISO week number.
      # A weekly key refreshes the local cache but must never be treated as the
      # canonical source of the historical archive.
      - name: Set cache key (year + ISO week)
        id: cache-key
        run: echo "key=traffy-csvs-$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore CSV cache
        id: csv-cache
        uses: actions/cache@v4
        with:
          path: backend/data
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: traffy-csvs-   # fall back to any previous week's cache

      - name: Report cache status
        run: |
          echo "Cache key : ${{ steps.cache-key.outputs.key }}"
          echo "Cache hit : ${{ steps.csv-cache.outputs.cache-hit }}"
          if [ -d backend/data ]; then
            csv_count=$(ls backend/data/bangkok_*.csv 2>/dev/null | wc -l)
            echo "CSVs in cache: $csv_count"
          else
            echo "No cached CSVs found — will download fresh."
          fi

      # ── Download ─────────────────────────────────────────────────────────────
      # continue-on-error is intentional here: Traffy's public API is
      # occasionally unavailable. If the download fails, we fall through and
      # attempt to run the pipeline on whatever CSVs are already cached.
      # The "Verify data availability" step below will fail loudly if we
      # have no usable data at all.
      - name: Download latest CSVs
        id: download
        continue-on-error: true
        env:
          TRAFFY_NAME:    ${{ secrets.TRAFFY_NAME    || 'Transparent City' }}
          TRAFFY_ORG:     ${{ secrets.TRAFFY_ORG     || 'Community Project' }}
          TRAFFY_PURPOSE: ${{ secrets.TRAFFY_PURPOSE || 'civic transparency research' }}
          TRAFFY_EMAIL:   ${{ secrets.TRAFFY_EMAIL   || 'kaungkhantlin999@gmail.com' }}
        run: |
          MONTHS=${{ github.event.inputs.months || '2' }}
          echo "▶ Downloading $MONTHS months of data from Traffy..."
          python backend/pipeline/download.py --months "$MONTHS"

      - name: Report download outcome
        run: |
          if [ "${{ steps.download.outcome }}" = "failure" ]; then
            echo "⚠️  Download step failed (Traffy API may be unavailable)."
            echo "   Attempting to run pipeline on cached CSVs instead."
          else
            echo "✅  Download step succeeded."
          fi

      # ── Verify we have something to process ──────────────────────────────────
      # This is the availability gate. The validation step below also enforces
      # the versioned historical-coverage contract, so a non-empty partial
      # cache can never replace the published multi-year dataset.
      - name: Verify data availability
        run: |
          if ! ls backend/data/bangkok_*.csv 1>/dev/null 2>&1; then
            echo "❌ No CSV files found and download failed."
            echo "   Manual fix: download CSVs from bangkok.traffy.in.th and commit them,"
            echo "   or re-run this workflow once Traffy's API is back online."
            exit 1
          fi
          echo "✅ Found $(ls backend/data/bangkok_*.csv | wc -l | tr -d ' ') CSV file(s) — proceeding with pipeline."

      # ── Validate inputs ───────────────────────────────────────────────────────
      # Run the standalone validator first — catches schema drift or bad downloads
      # before the expensive pipeline step.
      - name: Validate CSV inputs
        run: python backend/pipeline/validate.py --inputs

      # ── Run pipeline ──────────────────────────────────────────────────────────
      - name: Run data pipeline
        run: python backend/pipeline/process.py

      # ── Copy outputs to frontend ──────────────────────────────────────────────
      - name: Copy JSON outputs to frontend
        run: |
          mkdir -p frontend/public/data
          cp backend/public/data/*.json frontend/public/data/
          echo "✅ Copied pipeline outputs to frontend/public/data/"

      # ── Run pipeline tests ────────────────────────────────────────────────────
      # Tests run against the freshly generated frontend data.
      # If any invariant fails, the commit step is skipped — we never push bad data.
      - name: Run pipeline output tests
        run: pytest backend/tests/ -v --tb=short

      # ── Commit only if data actually changed ──────────────────────────────────
      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add frontend/public/data/

          if git diff --staged --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ No data changes — existing data is already current."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "data: weekly update ${DATE} [skip ci]"
            git push
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Pushed updated data to GitHub."
          fi

      # ── Job Summary ───────────────────────────────────────────────────────────
      # Written to $GITHUB_STEP_SUMMARY so it appears in the Actions UI.
      # Anyone can open the run and immediately see what happened.
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Traffy Data Update — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""

            # Download status
            if [ "${{ steps.download.outcome }}" = "success" ]; then
              echo "| Step | Status |"
              echo "|------|--------|"
              echo "| Download | ✅ Success |"
            else
              echo "| Step | Status |"
              echo "|------|--------|"
              echo "| Download | ⚠️ Failed (used cached CSVs) |"
            fi

            # CSV inventory
            echo ""
            echo "### CSV files in cache"
            echo '```'
            if ls backend/data/bangkok_*.csv 1>/dev/null 2>&1; then
              OLDEST=$(ls backend/data/bangkok_*.csv | head -1 | xargs basename | sed 's/bangkok_//' | sed 's/\.csv//')
              NEWEST=$(ls backend/data/bangkok_*.csv | tail -1 | xargs basename | sed 's/bangkok_//' | sed 's/\.csv//')
              COUNT=$(ls backend/data/bangkok_*.csv | wc -l | tr -d ' ')
              echo "Files : $COUNT"
              echo "Range : $OLDEST → $NEWEST"
            else
              echo "No CSV files found."
            fi
            echo '```'

            # Pipeline outputs
            echo ""
            echo "### Pipeline outputs"
            echo '```'
            if ls frontend/public/data/*.json 1>/dev/null 2>&1; then
              ls -lh frontend/public/data/*.json | awk '{printf "%-40s %s\n", $9, $5}'
            else
              echo "No output files found."
            fi
            echo '```'

            # Data profile summary
            if [ -f frontend/public/data/data_profile.json ]; then
              echo ""
              echo "### Data profile"
              echo '```'
              python3 -c "
          import json
          with open('frontend/public/data/data_profile.json') as f:
              p = json.load(f)
          ov_path = 'frontend/public/data/overview.json'
          with open(ov_path) as f:
              ov = json.load(f)
          print(f'Total tickets   : {ov[\"total_tickets\"]:,}')
          print(f'Resolution rate : {ov[\"resolution_rate\"]}%')
          print(f'Data range      : {ov[\"data_range\"][\"from\"]} → {ov[\"data_range\"][\"to\"]}')
          print(f'Districts       : {p[\"after_clean\"][\"unique_districts\"]}')
          print(f'Null coords     : {p[\"quality\"][\"null_coords_pct\"]}%')
          print(f'Null star       : {p[\"quality\"][\"null_star_pct\"]}%')
          issues = p[\"input\"][\"validation_issues\"]
          print(f'Validation issues: {len(issues)}')
          for iss in issues:
              print(f'  {iss}')
              "
              echo '```'
            fi

            # Data changed?
            echo ""
            if [ "${{ steps.commit.outputs.data_changed }}" = "true" ]; then
              echo "🚀 **New data committed and pushed — Vercel deploy triggered.**"
            else
              echo "ℹ️ No data changes this run — site continues serving existing data."
            fi

            echo ""
            echo "Next scheduled run: Monday 09:00 Bangkok time (02:00 UTC)"
          } >> "$GITHUB_STEP_SUMMARY"
